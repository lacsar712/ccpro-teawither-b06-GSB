{% extends "base.html" %}
{% block title %}萎凋槽{% endblock %}
{% block content %}
<div class="page-header">
  <h1>萎凋槽</h1>
  <div class="actions">
    <button class="btn btn-secondary btn-sm"
            hx-get="{% url 'trough_list' %}"
            hx-include="#status-filter"
            hx-target="#trough-table"
            hx-swap="innerHTML">刷新列表</button>
    <a class="btn" href="{% url 'trough_create' %}">新建槽位</a>
  </div>
</div>
<form id="status-filter" class="filter-bar" method="get" action="{% url 'trough_list' %}"
      hx-get="{% url 'trough_list' %}"
      hx-target="#trough-table"
      hx-swap="innerHTML"
      hx-trigger="change from:select, submit"
      hx-push-url="true">
  <label for="status">状态</label>
  <select id="status" name="status" class="input">
    <option value="">全部状态</option>
    {% for value, label in status_choices %}
    <option value="{{ value }}" {% if status_filter == value %}selected{% endif %}>{{ label }}</option>
    {% endfor %}
  </select>
  <button type="submit" class="btn btn-secondary btn-sm">筛选</button>
</form>
<div class="card" id="trough-table">
  {% include "troughs/_table.html" %}
</div>
{% endblock %}
