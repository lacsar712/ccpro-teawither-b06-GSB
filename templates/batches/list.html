{% extends "base.html" %}
{% block title %}萎凋批次{% endblock %}
{% block content %}
<div class="page-header">
  <h1>萎凋批次</h1>
  <div class="actions">
    <button class="btn btn-secondary btn-sm"
            hx-get="{% url 'batch_list' %}?{{ request.GET.urlencode }}"
            hx-target="#batch-table"
            hx-swap="innerHTML">刷新列表</button>
    <a class="btn" href="{% url 'batch_create' %}">新建批次</a>
  </div>
</div>
<form method="get" class="filter-bar"
      hx-get="{% url 'batch_list' %}"
      hx-target="#batch-table"
      hx-swap="innerHTML"
      hx-push-url="true"
      hx-trigger="change, submit">
  <label for="id_garden">茶园</label>
  {{ filter_form.garden }}
  <button class="btn btn-sm btn-secondary" type="submit">筛选</button>
  <a class="btn btn-sm btn-secondary" href="{% url 'batch_list' %}">清除</a>
</form>
<div class="card" id="batch-table">
  {% include "batches/_table.html" %}
</div>
{% endblock %}
